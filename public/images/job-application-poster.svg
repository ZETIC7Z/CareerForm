<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 720" width="100%" height="100%">
  <defs>
    <linearGradient id="jbBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#020617" />
      <stop offset="50%" stop-color="#0b1329" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <linearGradient id="itemGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="rgba(30, 41, 59, 0.9)" />
      <stop offset="100%" stop-color="rgba(15, 23, 42, 0.95)" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <filter id="jbShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <rect width="600" height="720" rx="24" fill="url(#jbBg)"/>
  
  <!-- Subtle Grid Accent -->
  <g opacity="0.04" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="90" x2="600" y2="90"/>
    <line x1="0" y1="180" x2="600" y2="180"/>
    <line x1="0" y1="270" x2="600" y2="270"/>
    <line x1="0" y1="360" x2="600" y2="360"/>
    <line x1="0" y1="450" x2="600" y2="450"/>
    <line x1="0" y1="540" x2="600" y2="540"/>
    <line x1="0" y1="630" x2="600" y2="630"/>
    <line x1="100" y1="0" x2="100" y2="720"/>
    <line x1="200" y1="0" x2="200" y2="720"/>
    <line x1="300" y1="0" x2="300" y2="720"/>
    <line x1="400" y1="0" x2="400" y2="720"/>
    <line x1="500" y1="0" x2="500" y2="720"/>
  </g>

  <!-- Top Header Banner -->
  <g transform="translate(40, 40)">
    <rect width="520" height="64" rx="12" fill="rgba(255, 255, 255, 0.04)" stroke="rgba(255, 255, 255, 0.08)"/>
    <circle cx="36" cy="32" r="16" fill="url(#cyanGrad)"/>
    <path d="M 36 24 L 40 32 L 32 32 Z M 32 35 L 40 35 L 40 38 L 32 38 Z" fill="#ffffff"/>
    <text x="64" y="27" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#ffffff" letter-spacing="0.5">CSC GOV CAREERS &amp; WES ANNEX</text>
    <text x="64" y="45" font-family="system-ui, sans-serif" font-size="10.5" font-weight="500" fill="#94a3b8">Official Plantilla Vacancies &amp; Work Experience Sheet</text>
    
    <rect x="420" y="18" width="84" height="28" rx="14" fill="rgba(6, 182, 212, 0.15)" stroke="#06b6d4" stroke-width="1"/>
    <text x="462" y="36" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#38bdf8" text-anchor="middle">3,400+ JOBS</text>
  </g>

  <!-- Featured Job Vacancy Card 1 -->
  <g transform="translate(40, 126)" filter="url(#jbShadow)">
    <rect width="520" height="152" rx="16" fill="url(#itemGrad)" stroke="rgba(255, 255, 255, 0.1)"/>
    
    <g transform="translate(24, 24)">
      <!-- Agency Badge -->
      <rect width="84" height="22" rx="11" fill="rgba(56, 189, 248, 0.15)" stroke="rgba(56, 189, 248, 0.3)"/>
      <text x="42" y="15" font-family="system-ui, sans-serif" font-size="9.5" font-weight="700" fill="#38bdf8" text-anchor="middle">DBM · SG-24</text>
      
      <text x="0" y="46" font-family="system-ui, sans-serif" font-size="15" font-weight="800" fill="#ffffff">Chief Administrative Officer (CAO)</text>
      <text x="0" y="66" font-family="system-ui, sans-serif" font-size="11.5" font-weight="500" fill="#cbd5e1">Department of Budget and Management · Central Office</text>
      
      <g transform="translate(0, 84)">
        <text x="0" y="14" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#10b981">₱90,078 / month</text>
        <text x="125" y="14" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">• Permanent Plantilla</text>
        <text x="260" y="14" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">• CSE-Professional</text>
      </g>

      <rect x="360" y="70" width="112" height="32" rx="8" fill="#0284c7"/>
      <text x="416" y="90" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">View Plantilla</text>
    </g>
  </g>

  <!-- Featured Job Vacancy Card 2 -->
  <g transform="translate(40, 300)" filter="url(#jbShadow)">
    <rect width="520" height="152" rx="16" fill="url(#itemGrad)" stroke="rgba(255, 255, 255, 0.1)"/>
    
    <g transform="translate(24, 24)">
      <rect width="84" height="22" rx="11" fill="rgba(16, 185, 129, 0.15)" stroke="rgba(16, 185, 129, 0.3)"/>
      <text x="42" y="15" font-family="system-ui, sans-serif" font-size="9.5" font-weight="700" fill="#34d399" text-anchor="middle">DOST · SG-19</text>
      
      <text x="0" y="46" font-family="system-ui, sans-serif" font-size="15" font-weight="800" fill="#ffffff">Senior Science Research Specialist</text>
      <text x="0" y="66" font-family="system-ui, sans-serif" font-size="11.5" font-weight="500" fill="#cbd5e1">DOST-ASTI · Information &amp; Communications Div</text>
      
      <g transform="translate(0, 84)">
        <text x="0" y="14" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#10b981">₱51,357 / month</text>
        <text x="125" y="14" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">• Permanent Plantilla</text>
        <text x="260" y="14" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">• RA 1080 / CSE-Prof</text>
      </g>

      <rect x="360" y="70" width="112" height="32" rx="8" fill="#0284c7"/>
      <text x="416" y="90" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">View Plantilla</text>
    </g>
  </g>

  <!-- WES Annex & Verification Box -->
  <g transform="translate(40, 474)">
    <rect width="520" height="206" rx="16" fill="rgba(15, 23, 42, 0.6)" stroke="rgba(56, 189, 248, 0.25)" stroke-dasharray="6,4"/>
    
    <g transform="translate(24, 28)">
      <text x="0" y="0" font-family="system-ui, sans-serif" font-size="13.5" font-weight="800" fill="#38bdf8">CSC WORK EXPERIENCE SHEET (WES) ANNEX</text>
      <text x="0" y="20" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">Mandatory attachment for CS Form 212 application submissions</text>
      
      <g transform="translate(0, 44)">
        <!-- Item 1 -->
        <circle cx="8" cy="8" r="6" fill="#10b981"/>
        <text x="24" y="12" font-family="system-ui, sans-serif" font-size="11.5" font-weight="600" fill="#e2e8f0">Chronological Accomplishments &amp; Key Outputs recorded</text>

        <!-- Item 2 -->
        <circle cx="8" cy="38" r="6" fill="#10b981"/>
        <text x="24" y="42" font-family="system-ui, sans-serif" font-size="11.5" font-weight="600" fill="#e2e8f0">Actual Duties &amp; Responsibilities mapped to Plantilla Item</text>

        <!-- Item 3 -->
        <circle cx="8" cy="68" r="6" fill="#10b981"/>
        <text x="24" y="72" font-family="system-ui, sans-serif" font-size="11.5" font-weight="600" fill="#e2e8f0">Civil Service Commission Form 212 Attachment Ready</text>
      </g>

      <rect x="0" y="128" width="472" height="32" rx="8" fill="rgba(56, 189, 248, 0.12)" stroke="rgba(56, 189, 248, 0.25)"/>
      <text x="236" y="148" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#38bdf8" text-anchor="middle">⚡ Auto-generate WES from your PDS Work History</text>
    </g>
  </g>
</svg>